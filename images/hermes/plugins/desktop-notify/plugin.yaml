name: desktop-notify
version: 0.1.0
description: "Pops a native desktop notification on the T14 (notify-send over ssh) for assistant turns whose reply actually lands in a chat Pebor reads (telegram, plus extra_platforms), so replies stay visible when Telegram shows no alert for a threaded bot chat. Turns delivered elsewhere (webhook, cron deliver:local) are skipped. Fail-open, dropped-never-buffered, JSON audit trail in notifications.jsonl. Exposes /notifytest."
author: "Hermes Agent"
provides_hooks:
  - post_llm_call
provides_commands:
  - notifytest
